<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise RAG & Hybrid Search API</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h1 { color: #38bdf8; margin: 0 0 0.25rem 0; font-size: 1.5rem; }
    .sub { color: #94a3b8; font-size: 0.875rem; }
    nav a { color: #94a3b8; text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
    .toolbar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0b1120; border: 1px solid #334155; color: #f8fafc; padding: 0.65rem; border-radius: 6px; margin-top: 0.35rem; margin-bottom: 1rem; font-family: inherit; }
    .toolbar input { width: 220px; margin: 0; }
    button { background: #0284c7; color: white; border: none; padding: 0.65rem 1.1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #334155; }
    button:hover { opacity: 0.92; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 1.5rem; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    .grounded { background: #065f46; color: #6ee7b7; }
    .refused { background: #7f1d1d; color: #fca5a5; }
    pre { background: #0b1120; padding: 0.85rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; font-size: 0.82rem; border: 1px solid #334155; }
    .citation { background: #0b1120; border-left: 3px solid #38bdf8; padding: 0.65rem; margin-top: 0.6rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Enterprise RAG &amp; Hybrid Search API</h1>
        <div class="sub">SQL Server 2025 Native VECTOR(768) &bull; Reciprocal Rank Fusion &bull; Anti-Hallucination Guardrails</div>
      </div>
      <nav>
        <a href="/swagger" target="_blank">OpenAPI / Swagger</a>
        <a href="/health" target="_blank">Health</a>
      </nav>
    </header>

    <div class="toolbar">
      <label style="margin:0">Active Tenant ID (<code>X-Tenant-Id</code>):</label>
      <input id="tenantId" value="acme-fintech-za" />
      <button type="button" class="secondary" onclick="loadSample()">Load Sample POPIA &amp; Treasury Policy</button>
    </div>

    <div class="grid">
      <div class="card">
        <h2>1. Ingest Knowledge Document</h2>
        <label>Document Title</label>
        <input id="docTitle" placeholder="e.g., POPIA Retention & Ledger Policy v2.4" />
        <label>Source URI</label>
        <input id="sourceUri" placeholder="s3://policies/popia-retention-v2.4.pdf" />
        <label>Document Text</label>
        <textarea id="docContent" rows="7" placeholder="Paste policy or technical documentation..."></textarea>
        <button type="button" onclick="ingestDoc()">Chunk, Embed &amp; Index</button>
        <div id="ingestResult" style="margin-top:1rem;font-size:0.875rem;color:#38bdf8;"></div>
      </div>

      <div class="card">
        <h2>2. Grounded Hybrid Query</h2>
        <label>Ask a Question</label>
        <input id="question" value="What is the exact retention period under POPIA Section 14 and the threshold for dual treasury approval?" />
        <button type="button" onclick="runQuery()">Run Hybrid Search + Synthesis</button>
        <div id="queryResult" style="margin-top:1rem;"></div>
      </div>
    </div>
  </div>

  <script>
    function loadSample() {
      document.getElementById('docTitle').value = 'ZAR Treasury & POPIA Compliance Standard (POL-2026-09)';
      document.getElementById('sourceUri').value = 'internal://compliance/POL-2026-09';
      document.getElementById('docContent').value =
        'Section 1 (POPIA Section 14 Retention): All customer KYC and double-entry wallet ledger audit trails must be retained in immutable append-only storage for exactly 5 years following account closure.\n\n' +
        'Section 2 (Treasury Dual-Control): Any single outbound ZAR settlement exceeding R250,000.00 requires dual cryptographic approval from two senior treasury officers and triggers automated SARB FinSurv reporting within 24 hours.';
    }

    async function ingestDoc() {
      const tenant = document.getElementById('tenantId').value;
      const out = document.getElementById('ingestResult');
      out.textContent = 'Chunking and generating 768-dim embeddings...';
      try {
        const res = await fetch('/api/documents/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Tenant-Id': tenant },
          body: JSON.stringify({
            title: document.getElementById('docTitle').value,
            sourceUri: document.getElementById('sourceUri').value,
            content: document.getElementById('docContent').value
          })
        });
        const text = await res.text();
        if (!res.ok) {
          out.innerHTML = `<span class="badge refused">HTTP ${res.status}</span><pre>${text}</pre>`;
          return;
        }
        const data = JSON.parse(text);
        out.textContent = `Indexed "${data.title}" (${data.chunkCount} chunks, Deduplicated: ${data.deduplicated})`;
      } catch (err) {
        out.innerHTML = `<span class="badge refused">ERROR</span><pre>${err}</pre>`;
      }
    }

    async function runQuery() {
      const tenant = document.getElementById('tenantId').value;
      const out = document.getElementById('queryResult');
      out.innerHTML = 'Running vector + lexical RRF search...';
      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Tenant-Id': tenant },
          body: JSON.stringify({ question: document.getElementById('question').value, topK: 3 })
        });
        const text = await res.text();
        if (!res.ok) {
          out.innerHTML = `<span class="badge refused">HTTP ${res.status}</span><pre>${text}</pre>`;
          return;
        }
        const data = JSON.parse(text);
        const badge = data.grounded
          ? `<span class="badge grounded">GROUNDED &bull; ${data.providerUsed} &bull; ${data.latencyMs}ms</span>`
          : `<span class="badge refused">REFUSED — ANTI-HALLUCINATION GATE &bull; ${data.latencyMs}ms</span>`;
        const cites = (data.citations || []).map(c =>
          `<div class="citation"><strong>[${c.documentTitle} | Chunk #${c.chunkIndex}]</strong> (Vec: ${c.vectorSimilarity}, KW: ${c.keywordScore}, RRF: ${c.rrfScore})<br/>${c.excerpt}</div>`
        ).join('');
        out.innerHTML = `${badge}<p style="line-height:1.55;">${data.answer}</p>${cites}`;
      } catch (err) {
        out.innerHTML = `<span class="badge refused">ERROR</span><pre>${err}</pre>`;
      }
    }
  </script>
</body>
</html>
