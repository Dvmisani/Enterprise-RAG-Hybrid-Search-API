services:
  sqlserver2025:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: enterprise-rag-sql2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_Strong_Password123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver2025:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver2025 -U sa -P 'Your_Strong_Password123!' -C -Q 'IF DB_ID(N''EnterpriseRagDb'') IS NULL CREATE DATABASE EnterpriseRagDb;'"

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-api
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver2025,1433;Database=EnterpriseRagDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
